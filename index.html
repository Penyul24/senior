<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dating Match</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:360px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.photo{
    position:relative;
}

.photo img{
    width:100%;
    height:500px;
    object-fit:cover;
    display:block;
}

.info{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    padding:20px;
    color:#fff;
    background:linear-gradient(transparent,rgba(0,0,0,.8));
}

.info h2{
    font-size:28px;
}

.info p{
    font-size:15px;
    margin-top:5px;
}

.text{
    padding:20px;
    text-align:center;
    color:#555;
    font-size:16px;
}

.buttons{
    display:flex;
    gap:15px;
    padding:0 20px 25px;
}

.buttons button{
    flex:1;
    padding:15px;
    border:none;
    border-radius:50px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

.left{
    background:#ff4d4d;
    color:#fff;
}

.right{
    background:#1ecb63;
    color:#fff;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>
<body>

<div class="card">

    <div class="photo">
        <img src="c104bca8-8de0-4c23-92d2-150931d477ad.jpeg" alt="">
        <div class="info">
            <h2>Evelyn, 43</h2>
            <p>📍 New York • Loves Travel ❤️</p>
        </div>
    </div>

    <div class="text">
        Swipe to see the next profile
    </div>

    <div class="buttons">
        <button class="left" onclick="window.location.href='https://track.chatvideocall.net/s/9a24608a59183?track=lewaisuo'">
            ⬅ Swipe Left
        </button>

        <button class="right" onclick="window.location.href='https://track.chatvideocall.net/s/9a24608a59183?track=lewaisuo'">
            Swipe Right ➜
        </button>
    </div>

</div>

</body>
</html>
