<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Single Momy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(255,255,255,0.45),
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(255,105,160,0.35),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #ffc4dc,
          #f58ab8 50%,
          #e85b9c
        );

      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 55px 22px 45px;

      display: flex;
      flex-direction: column;
      align-items: center;

      position: relative;
    }

    /* BACKGROUND BLOBS */

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
    }

    .blob-one {
      width: 180px;
      height: 180px;
      background: #ffffff;
      top: 5%;
      left: -80px;
      opacity: 0.28;
    }

    .blob-two {
      width: 220px;
      height: 220px;
      background: #ff4f91;
      bottom: 5%;
      right: -110px;
      opacity: 0.25;
    }

    /* PROFILE */

    .photo-wrapper {
      position: relative;
      width: 165px;
      height: 165px;
      margin-bottom: 25px;
      z-index: 2;
    }

    .photo-wrapper::after {
      content: "";
      position: absolute;
      inset: -7px;

      border-radius: 38px;

      background: linear-gradient(
        135deg,
        #ffffff,
        #ff5f9d,
        #ffffff,
        #ff8fbd
      );

      z-index: 0;

      animation: rotateBorder 5s linear infinite;
    }

    @keyframes rotateBorder {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .profile-photo {
      position: relative;
      z-index: 2;

      width: 165px;
      height: 165px;

      object-fit: cover;

      border-radius: 34px;
      border: 5px solid rgba(255,255,255,0.9);

      box-shadow:
        0 20px 45px rgba(130, 30, 75, 0.28);
    }

    /* NAME */

    .profile-name {
      font-size: 43px;
      font-weight: 800;
      letter-spacing: -1px;

      margin-bottom: 8px;

      text-align: center;

      background: linear-gradient(
        90deg,
        #ffffff,
        #fff1f7,
        #ffffff
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      position: relative;
      z-index: 2;

      text-shadow:
        0 4px 15px rgba(130, 30, 75, 0.15);
    }

    .subtitle {
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;

      margin-bottom: 28px;

      position: relative;
      z-index: 2;
    }

    /* DIVIDER */

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;

      width: 180px;
      margin-bottom: 30px;

      position: relative;
      z-index: 2;
    }

    .divider span {
      flex: 1;
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.8)
      );
    }

    .divider b {
      color: #ffffff;
      font-size: 18px;

      text-shadow:
        0 3px 10px rgba(150, 20, 80, 0.25);
    }

    /* CTA */

    .cta {
      position: relative;
      overflow: hidden;
      z-index: 2;

      width: 100%;
      max-width: 380px;
      min-height: 76px;

      margin-bottom: 16px;

      display: flex;
      align-items: center;

      padding: 10px 20px;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.38),
          rgba(255,255,255,0.20)
        );

      border: 1px solid rgba(255,255,255,0.55);

      color: white;
      text-decoration: none;

      box-shadow:
        0 15px 35px rgba(130, 30, 75, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.5);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease;
    }

    .cta::before {
      content: "";

      position: absolute;
      width: 120px;
      height: 120px;

      right: -55px;
      top: -50px;

      border-radius: 50%;

      background: rgba(255,255,255,0.22);

      filter: blur(10px);
    }

    .cta:hover {
      transform: translateY(-5px);

      border-color: rgba(255,255,255,0.85);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.48),
          rgba(255,255,255,0.25)
        );

      box-shadow:
        0 20px 40px rgba(130, 30, 75, 0.25);
    }

    .cta:active {
      transform: scale(0.97);
    }

    /* ICON */

    .icon-box {
      width: 52px;
      height: 52px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 16px;

      background: rgba(255,255,255,0.25);

      border: 1px solid rgba(255,255,255,0.35);
    }

    .icon {
      width: 29px;
      height: 29px;

      position: relative;
      z-index: 2;

      filter: brightness(0) invert(1);
    }

    /* TEXT */

    .cta-text {
      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;

      margin-left: 16px;
    }

    .cta-title {
      font-size: 18px;
      font-weight: 700;

      margin-bottom: 4px;

      text-shadow:
        0 2px 8px rgba(130, 30, 75, 0.2);
    }

    .cta-description {
      font-size: 12px;
      color: rgba(255,255,255,0.82);
    }

    .arrow {
      margin-left: auto;

      font-size: 22px;

      color: rgba(255,255,255,0.8);

      position: relative;
      z-index: 2;

      transition: transform 0.25s ease;
    }

    .cta:hover .arrow {
      transform: translateX(5px);
      color: #ffffff;
    }

    /* FOOTER */

    .footer {
      margin-top: 18px;

      font-size: 11px;
      color: rgba(255,255,255,0.75);

      letter-spacing: 1px;

      position: relative;
      z-index: 2;
    }

    /* MOBILE */

    @media (max-width: 480px) {

      .container {
        padding: 45px 18px 35px;
      }

      .photo-wrapper,
      .profile-photo {
        width: 145px;
        height: 145px;
      }

      .photo-wrapper::after {
        inset: -6px;
      }

      .profile-photo {
        border-radius: 30px;
      }

      .profile-name {
        font-size: 37px;
      }

      .subtitle {
        font-size: 12px;
        margin-bottom: 24px;
      }

      .cta {
        min-height: 70px;
        border-radius: 20px;
      }

      .icon-box {
        width: 48px;
        height: 48px;
        border-radius: 14px;
      }

      .icon {
        width: 26px;
        height: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="blob blob-one"></div>
  <div class="blob blob-two"></div>

  <div class="container">

    <!-- PROFILE PHOTO -->

    <div class="photo-wrapper">
      <img
        class="profile-photo"

    <div class="footer">

  </div>

</body>
</html>
