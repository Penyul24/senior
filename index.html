<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Profile</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: linear-gradient(135deg, #ffb6c9, #f98eae);
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      padding: 60px 25px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    
    .profile-photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      margin-bottom: 45px;
    }

    
    .cta {
      width: 100%;
      max-width: 330px;
      height: 58px;
      margin-bottom: 20px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      border-radius: 50px;
      background: white;
      color: #e75480;

      text-decoration: none;
      font-size: 17px;
      font-weight: bold;

      box-shadow: 0 7px 20px rgba(0, 0, 0, 0.12);

      transition: all 0.25s ease;
    }

    .cta:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
    }

    .cta:active {
      transform: scale(0.97);
    }

    /* ICON */
    .icon {
      width: 25px;
      height: 25px;
      object-fit: contain;
    }

    @media (max-width: 480px) {
      .container {
        padding-top: 45px;
      }

      .profile-photo {
        width: 135px;
        height: 135px;
        margin-bottom: 40px;
      }

      .cta {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <img
      class="profile-photo"
      src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500"
      alt="Profile Photo"
    >
    <a
      class="cta"
      href="https://go.chatvideocall.net/?utm_source=da57dc555e50572d&ban=fb&j1=1&s1=217823&s2=2011036&s3=xmass&click_id=bacarat"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        class="icon"
        src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/whatsapp.svg"
        alt="WhatsApp"
      >
      WhatsApp
    </a>

    <a
      class="cta"
      href="https://go.chatvideocall.net/?utm_source=da57dc555e50572d&ban=fb&j1=1&s1=217823&s2=2011036&s3=xmass&click_id=mykonos"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        class="icon"
        src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/youtube.svg"
        alt="Video"
      >
      Video
    </a>

  </div>

</body>
</html>
