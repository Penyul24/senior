<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Single Momy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 105, 160, 0.25), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(150, 80, 255, 0.22), transparent 35%),
        linear-gradient(145deg, #160b18, #2a1025 50%, #120b19);

      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 55px 22px 45px;

      display: flex;
      flex-direction: column;
      align-items: center;

      position: relative;
    }

    /* BACKGROUND BLOBS */

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.25;
      pointer-events: none;
    }

    .blob-one {
      width: 180px;
      height: 180px;
      background: #ff4f91;
      top: 5%;
      left: -80px;
    }

    .blob-two {
      width: 220px;
      height: 220px;
      background: #8e4dff;
      bottom: 5%;
      right: -110px;
    }

    /* PROFILE */

    .photo-wrapper {
      position: relative;
      width: 165px;
      height: 165px;
      margin-bottom: 25px;
    }

    .photo-wrapper::after {
      content: "";
      position: absolute;
      inset: -7px;

      border-radius: 38px;

      background: linear-gradient(
        135deg,
        #ff7bab,
        #ffffff,
        #b46cff
      );

      z-index: 0;

      animation: rotateBorder 5s linear infinite;
    }

    @keyframes rotateBorder {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .profile-photo {
      position: relative;
      z-index: 2;

      width: 165px;
      height: 165px;

      object-fit: cover;

      border-radius: 34px;
      border: 5px solid #21101f;

      box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.45);
    }

    /* NAME */

    .profile-name {
      font-size: 43px;
      font-weight: 800;
      letter-spacing: -1px;

      margin-bottom: 8px;

      text-align: center;

      background: linear-gradient(
        90deg,
        #ffffff,
        #ff9dc2,
        #ffffff
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: rgba(255,255,255,0.65);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;

      margin-bottom: 28px;
    }

    /* DIVIDER */

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;

      width: 180px;
      margin-bottom: 30px;
    }

    .divider span {
      flex: 1;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.5)
      );
    }

    .divider b {
      color: #ff7eae;
      font-size: 18px;
    }

    /* CTA */

    .cta {
      position: relative;
      overflow: hidden;

      width: 100%;
      max-width: 380px;
      min-height: 76px;

      margin-bottom: 16px;

      display: flex;
      align-items: center;

      padding: 10px 20px;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.13),
          rgba(255,255,255,0.05)
        );

      border: 1px solid rgba(255,255,255,0.15);

      color: white;
      text-decoration: none;

      box-shadow:
        0 15px 35px rgba(0,0,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.08);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease;
    }

    .cta::before {
      content: "";

      position: absolute;
      width: 120px;
      height: 120px;

      right: -55px;
      top: -50px;

      border-radius: 50%;

      background: rgba(255, 105, 160, 0.16);

      filter: blur(10px);
    }

    .cta:hover {
      transform: translateY(-5px);

      border-color: rgba(255,130,180,0.6);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.18),
          rgba(255,255,255,0.07)
        );

      box-shadow:
        0 20px 40px rgba(0,0,0,0.35);
    }

    .cta:active {
      transform: scale(0.97);
    }

    /* ICON */

    .icon-box {
      width: 52px;
      height: 52px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 16px;

      background: rgba(255,255,255,0.12);
    }

    .icon {
      width: 29px;
      height: 29px;

      filter: brightness(0) invert(1);

      position: relative;
      z-index: 2;
    }

    /* TEXT */

    .cta-text {
      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;

      margin-left: 16px;
    }

    .cta-title {
      font-size: 18px;
      font-weight: 700;

      margin-bottom: 4px;
    }

    .cta-description {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
    }

    .arrow {
      margin-left: auto;

      font-size: 22px;

      color: rgba(255,255,255,0.55);

      position: relative;
      z-index: 2;

      transition: transform 0.25s ease;
    }

    .cta:hover .arrow {
      transform: translateX(5px);
      color: #ff91b8;
    }

    /* FOOTER */

    .footer {
      margin-top: 18px;

      font-size: 11px;
      color: rgba(255,255,255,0.35);

      letter-spacing: 1px;
    }

    /* MOBILE */

    @media (max-width: 480px) {

      .container {
        padding: 45px 18px 35px;
      }

      .photo-wrapper,
      .profile-photo {
        width: 145px;
        height: 145px;
      }

      .photo-wrapper::after {
        inset: -6px;
      }

      .profile-photo {
        border-radius: 30px;
      }

      .profile-name {
        font-size: 37px;
      }

      .subtitle {
        font-size: 12px;
        margin-bottom: 24px;
      }

      .cta {
        min-height: 70px;
        border-radius: 20px;
      }

      .icon-box {
        width: 48px;
        height: 48px;
        border-radius: 14px;
      }

      .icon {
        width: 26px;
        height: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="blob blob-one"></div>
  <div class="blob blob-two"></div>

  <div class="container">

    <!-- PROFILE PHOTO -->

    <div class="photo-wrapper">
      <img
        class="profile-photo"
        src="FB_IMG_1784880683467.jpg"
        alt="Single Momy Profile"
      >
    </div>

    <!-- PROFILE NAME -->

    <h1 class="profile-name">Single Momy🤍</h1>

    <div class="subtitle">
      Nice to meet you
    </div>

    <!-- DIVIDER -->

    <div class="divider">
      <span></span>
      <b>♥</b>
      <span></span>
    </div>

    <!-- WHATSAPP CTA -->

    <a
      class="cta"
      href="https://track.chatvideocall.net/s/9a24608a59183?track=abs"
      target="_blank"
      rel="noopener noreferrer"
    >

      <div class="icon-box">
        <img
          class="icon"
          src="https://track.chatvideocall.net/s/9a24608a59183?track=abs"
          alt="WhatsApp"
        >
      </div>

      <div class="cta-text">
        <div class="cta-title">WhatsApp</div>
        <div class="cta-description">Let's have a little chat</div>
      </div>

      <div class="arrow">›</div>

    </a>

    <!-- VIDEO CTA -->

    <a
      class="cta"
      href="https://track.chatvideocall.net/s/9a24608a59183?track=abs"
      target="_blank"
      rel="noopener noreferrer"
    >

      <div class="icon-box">
        <img
          class="icon"
          src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/youtube.svg"
          alt="Video"
        >
      </div>

      <div class="cta-text">
        <div class="cta-title">Video</div>
        <div class="cta-description">Watch something special</div>
      </div>

      <div class="arrow">›</div>

    </a>

    <div class="footer">
      ✦ Made with love ✦
    </div>

  </div>

</body>
</html>
