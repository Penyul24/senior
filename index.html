<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dating Match</title>
<link rel="preload" as="image" href="c104bca8-8de0-4c23-92d2-150931d477ad.jpeg">
<style>
*{margin:0;padding:0;box-sizing:border-box;font:16px Arial,sans-serif}
body{display:grid;place-items:center;min-height:100vh;background:#f5f5f5}
.card{width:360px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.photo{position:relative}
.photo img{display:block;width:100%;height:500px;object-fit:cover}
.info{position:absolute;left:0;right:0;bottom:0;padding:20px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.info h2{font-size:28px}
.info p{font-size:15px;margin-top:5px}
</style>
</head>
<body>

<div class="card">
  <div class="photo">
    <img src="c104bca8-8de0-4c23-92d2-150931d477ad.jpeg"
         width="360"
         height="500"
         fetchpriority="high"
         decoding="async"
         alt="Dating Photo">
    <div class="info">
      <h2>Evelyn, 43</h2>
      <p>📍 New York • Loves Travel ❤️</p>
    </div>
  </div>
</div>

</body>
</html>
